<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>Markdown Viewer 設定</title>
    <style>
      body {
        margin: 0;
        padding: 24px;
        min-width: 360px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
          "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
        font-size: 14px;
        color: #1f2328;
      }
      h1 { font-size: 16px; margin: 0 0 16px; }
      label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
      .desc { margin: 8px 0 0 24px; color: #656d76; font-size: 12px; line-height: 1.6; }
      #status { display: inline-block; margin-top: 12px; color: #1a7f37; height: 1em; }
      @media (prefers-color-scheme: dark) {
        body { background: #0d1117; color: #e6edf3; }
        .desc { color: #8b949e; }
        #status { color: #3fb950; }
      }
    </style>
  </head>
  <body>
    <h1>Markdown Viewer 設定</h1>
    <label>
      <input type="checkbox" id="utf8" />
      テキストを UTF-8 として解釈する
    </label>
    <p class="desc">
      文字化けする場合の対策です。ON にすると元データを取得し直して UTF-8
      でデコードします。OFF の場合はブラウザが判定した文字コードをそのまま使います。
    </p>
    <div id="status"></div>
    <script src="options.js"></script>
  </body>
</html>
